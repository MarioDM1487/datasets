name: Android APK (Tepore)

# Builds an installable debug APK in the cloud (no Mac needed).
# Download it from the run's "Artifacts" when finished, then install on the
# phone (enable "install unknown apps"). Debug APKs are signed with the
# standard debug key — no Play/developer account required for sideloading.

on:
  workflow_dispatch:
  push:
    branches: [ claude/holyiot-beacon-reader-nhsnry ]
    paths:
      - 'tepore-app/**'
      - 'holyiot-beacon-reader/tepore.html'
      - 'holyiot-beacon-reader/tepore.webmanifest'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tepore-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install deps
        run: npm ci

      - name: Build web + native bridge
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Use fixed debug keystore
        # Sign every build with the same committed debug key so updates install
        # over each other (a fresh runner key would cause "App non installata").
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: tepore-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tepore-debug-apk
          path: tepore-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
