name: Deploy Beacon Reader to Pages

# Pubblica la webapp HolyIoT Beacon Reader su GitHub Pages via HTTPS.
# Abilita Pages automaticamente al primo run (enablement: true), così non
# serve toccare le impostazioni del repository a mano.

on:
  push:
    branches:
      - claude/holyiot-beacon-reader-nhsnry
    paths:
      - "holyiot-beacon-reader/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload app folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: holyiot-beacon-reader
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
