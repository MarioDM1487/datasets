<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b1512" />
<title>MANTO</title>
<link rel="manifest" href="manto.webmanifest" />
<style>
  :root{
    --bg:#ece3d2; --bg2:#e3d7c0; --surface:#fbf5ea; --surface2:#f1e7d5;
    --ink:#2a2018; --muted:#7a6a54; --line:#ddccb2;
    --accent:#7c3b46; --gold:#b98a3e;
    --cold:#3f78b0; --ideal:#4f9a68; --warn:#c98a3a; --hot:#cf5f3e;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#1b1512; --bg2:#120d0b; --surface:#241c18; --surface2:#2d241e;
    --ink:#f0e7d9; --muted:#a99a86; --line:#3a2e26; --accent:#c9727f; --gold:#d3a559;
  }}
  :root[data-theme="dark"]{--bg:#1b1512;--bg2:#120d0b;--surface:#241c18;--surface2:#2d241e;
    --ink:#f0e7d9;--muted:#a99a86;--line:#3a2e26;--accent:#c9727f;--gold:#d3a559}
  :root[data-theme="light"]{--bg:#ece3d2;--bg2:#e3d7c0;--surface:#fbf5ea;--surface2:#f1e7d5;
    --ink:#2a2018;--muted:#7a6a54;--line:#ddccb2;--accent:#7c3b46;--gold:#b98a3e}

  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);
    background:radial-gradient(130% 80% at 50% -8%,var(--bg2),var(--bg) 60%);
    min-height:100vh;
    padding:max(14px,env(safe-area-inset-top)) 16px calc(78px + env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;-webkit-font-smoothing:antialiased}

  .appbar{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
  .logo{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.14em}
  .logo .d{color:var(--accent)}
  .appbar .sp{flex:1}
  .live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
  .live .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .live .dot.on{background:var(--ideal);box-shadow:0 0 8px var(--ideal)}

  .view{display:none} .view.on{display:block}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .card.q{background:var(--surface2)}
  h2.t{font-family:var(--serif);font-size:18px;margin:2px 2px 10px}
  .sub{color:var(--muted);font-size:12.5px;line-height:1.5}

  /* horse selector */
  .hsel{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch}
  .hsel::-webkit-scrollbar{display:none}
  .hchip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:8px 15px;font-weight:700;font-size:13px}
  .hchip.on{border-color:var(--accent);color:#fff;background:var(--accent)}
  .hchip.add{color:var(--accent);font-weight:800}

  /* identity */
  .idrow{display:flex;align-items:center;gap:12px}
  .av{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;flex:0 0 auto;
    background:linear-gradient(150deg,var(--surface2),var(--bg2));border:1px solid var(--line)}
  .idrow .nm{font-family:var(--serif);font-size:19px;font-weight:700}
  .idrow .mt{font-size:12px;color:var(--muted);margin-top:1px}
  .idrow .sp{flex:1}
  .pill{font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid transparent;white-space:nowrap}

  .word{font-family:var(--serif);font-size:27px;font-weight:700;display:flex;align-items:center;gap:9px;margin-top:2px}
  .lamp{width:12px;height:12px;border-radius:50%}
  .msg{font-size:13.5px;color:var(--muted);line-height:1.5;margin:10px 0 14px}
  .band{position:relative;height:14px;border-radius:8px;
    background:linear-gradient(90deg,var(--cold),#89b48f 32%,var(--ideal) 50%,#c8a05a 68%,var(--hot))}
  .mk{position:absolute;top:-4px;width:4px;height:22px;background:var(--ink);border-radius:3px;
    transform:translateX(-50%);box-shadow:0 0 0 3px var(--surface);transition:left .5s ease}
  .bl{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
  .tile.plain{background:var(--surface)}
  .tile .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tile .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1}
  .tile .v small{font-size:11px;color:var(--muted);font-weight:600}
  .tile .s{font-size:11px;color:var(--muted);margin-top:3px}

  .alarm{background:color-mix(in srgb,var(--hot) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--hot) 40%,transparent);
    color:var(--hot);border-radius:14px;padding:12px;margin-top:12px;font-weight:800;text-align:center;animation:pulse 1.1s infinite}
  .alarm.cold{background:color-mix(in srgb,var(--cold) 14%,var(--surface));border-color:color-mix(in srgb,var(--cold) 40%,transparent);color:var(--cold)}
  @keyframes pulse{50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){.alarm{animation:none}}

  button{font:inherit;font-family:var(--sans);cursor:pointer}
  .btn{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;border:0;border-radius:13px;padding:14px;font-weight:700;font-size:14.5px}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn.sm{padding:10px;font-size:13px;border-radius:11px}
  .btn.danger{color:var(--hot);border-color:var(--hot)}

  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:12px 2px 8px}

  .dev{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}
  .dev .rd{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);font-size:15px;flex:0 0 auto}
  .dev .nm{font-weight:700;font-size:13.5px} .dev .mt{font-size:11px;color:var(--muted);margin-top:1px}
  .dev .sp{flex:1;min-width:0}
  .rolebtns{display:flex;gap:6px}
  .rb{font-size:11px;font-weight:700;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
  .rb.on{border-color:var(--accent);color:#fff;background:var(--accent)}
  .dev.hl{border-color:var(--ideal);box-shadow:0 0 0 2px color-mix(in srgb,var(--ideal) 30%,transparent)}
  .badge{font-size:10px;font-weight:800;padding:3px 7px;border-radius:7px;margin-left:6px;white-space:nowrap;vertical-align:1px}
  .badge.near{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
  .badge.blow{background:color-mix(in srgb,var(--ideal) 22%,transparent);color:var(--ideal)}

  .hcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:13px;margin-bottom:10px}
  .hcard.on{border-color:var(--accent)}
  .hcard .edit{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);font-weight:600}

  .alert{display:flex;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;position:relative;overflow:hidden}
  .alert .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
  .alert .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;font-size:16px}
  .alert .t{font-weight:700;font-size:13.5px} .alert .d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .alert .tm{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

  label.f{display:block;font-size:12px;color:var(--muted);margin:10px 2px 4px;font-weight:600}
  input.f{width:100%;font:inherit;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  svg{display:block;width:100%;height:auto}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:space-around;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:9px 6px calc(8px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
  .nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);font-weight:600;flex:1}
  .nav button.on{color:var(--accent)}
  .nav svg{width:22px;height:22px}
  .notice{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.5}
  .notice.err{border-left-color:var(--hot)}
  .notice a{color:var(--accent)}
</style>
</head>
<body>

<div class="appbar">
  <span class="logo">MAN<span class="d">·</span>TO</span>
  <span class="sp"></span>
  <span class="live"><span class="dot" id="live"></span><span id="liveTxt">non attivo</span></span>
</div>

<div id="notice"></div>

<section class="view on" id="v-home"></section>
<section class="view" id="v-storico"></section>
<section class="view" id="v-avvisi"></section>
<section class="view" id="v-scheda"></section>
<section class="view" id="v-sensori"></section>

<nav class="nav">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Oggi</button>
  <button data-go="storico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 15l5-5 4 3 6-7"/></svg>Storico</button>
  <button data-go="avvisi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>Avvisi</button>
  <button data-go="scheda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Cavalli</button>
  <button data-go="sensori"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v6m0 8v6M2 12h6m8 0h6"/><circle cx="12" cy="12" r="3"/></svg>Sensori</button>
</nav>

<script>
"use strict";
const $=s=>document.querySelector(s);
const uid=()=>"h"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- persistence ---------- */
const store={
  get(k,d){ try{const v=localStorage.getItem("manto_"+k);return v==null?d:JSON.parse(v);}catch(_){return d;} },
  set(k,v){ localStorage.setItem("manto_"+k, JSON.stringify(v)); }
};
function defaultHorse(name){ return {id:uid(), name:name||"Nuovo cavallo", breed:"", sex:"", age:"",
  weight:"", blanket:"", box:"", notes:"", roles:{}}; }

/* Multi-horse model. Each horse owns its two sensors (sotto coperta + esterno,
   one external per blanket) and its own history + alerts. */
let horses = store.get("horses", null);
if(!horses){
  const oldH=store.get("horse",null), oldR=store.get("roles",{});
  const h=Object.assign(defaultHorse("Fulmine"), oldH||{}, {id:uid(), roles:oldR||{}});
  horses=[h]; store.set("horses",horses);
}
let activeId = store.get("activeId", horses[0].id);
if(!horses.some(h=>h.id===activeId)) activeId=horses[0].id;
let historyMap = store.get("history_v2", {});   // {horseId:[{t,uT,uH,eT}]}   (retention 24h/7g: idea per il futuro, non ancora applicata)
let alertsMap  = store.get("alerts_v2", {});    // {horseId:[{t,key,title,detail}]}  (notifiche push: possibile evoluzione futura)

const activeHorse=()=>horses.find(h=>h.id===activeId)||horses[0];
const histOf=id=>historyMap[id]||(historyMap[id]=[]);
const alertsOf=id=>alertsMap[id]||(alertsMap[id]=[]);

/* ---------- comfort thresholds (indicative, tune with a vet) ---------- */
const TH={ freddo:14, fresco:18, ideale:28, caldo:32, humSweat:82 };
function comfort(uT,uH,eT){
  if(uT==null) return null;
  let key;
  if(uH!=null && uH>=TH.humSweat) key="sudore";
  else if(uT>TH.caldo) key="sudore";
  else if(uT>=TH.ideale) key="caldo";
  else if(uT>=TH.fresco) key="ideale";
  else if(uT>=TH.freddo) key="fresco";
  else key="freddo";
  const meta={
    freddo:{label:"Troppo freddo",color:"var(--cold)",sev:"cold",msg:"La coperta non basta: l'animale sta perdendo calore."},
    fresco:{label:"Fresco",color:"var(--cold)",sev:"info",msg:"Un po' fresco. Tieni d'occhio l'andamento."},
    ideale:{label:"Al caldo",color:"var(--ideal)",sev:"ok",msg:"Comfort ottimale: la coperta mantiene il calore giusto."},
    caldo:{label:"Si scalda",color:"var(--warn)",sev:"warn",msg:"Sta diventando troppo caldo sotto la coperta."},
    sudore:{label:"Sudorazione",color:"var(--hot)",sev:"hot",msg:"Rischio sudore: poi il sudore raffredda l'animale."},
  }[key];
  let pos=(uT-8)/(36-8)*100;
  if(key==="sudore" && uT<=TH.caldo) pos=88;
  pos=Math.max(3,Math.min(97,pos));
  return {key,pos,...meta};
}

/* ---------- BLE decode ---------- */
const bytesOf=dv=>new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength);
function decodeHolyIoT(cid,dv){
  if(cid!==0xffff) return null;
  const b=bytesOf(dv);
  if(b.length>=23 && b[0]===0x02 && b[1]===0x15) return null;
  const d=new DataView(b.buffer,b.byteOffset,b.byteLength);
  if(b.length===7) return {temp:d.getInt16(1,false)/10, hum:d.getInt16(3,false)/10};
  if(b.length===5) return {press:((b[1]<<16)|(b[2]<<8)|b[3])/100};
  return null;
}

/* ---------- live sensor state ---------- */
const live=new Map();
let scanning=false, leScan=null, scanStarted=false, needGesture=false;
function ingest(ev){
  const id=ev.device?.id||ev.device?.name||"?";
  let r=live.get(id); if(!r){ r={id,name:ev.device?.name||"Sensore",temp:null,hum:null,press:null}; live.set(id,r); }
  r.name=ev.device?.name||r.name; r.rssi=ev.rssi??r.rssi; r.seen=Date.now();
  if(ev.manufacturerData) for(const [cid,dv] of ev.manufacturerData){
    const h=decodeHolyIoT(cid,dv);
    if(h){
      if(h.temp!=null){
        r.temp=h.temp;
        if(h.hum!=null){
          // "soffio per identificare": a breath spikes humidity vs a slow baseline
          if(r.humAvg==null) r.humAvg=h.hum;
          if(h.hum - r.humAvg > 10) r.idUntil=Date.now()+4000;
          r.humAvg=r.humAvg*0.85 + h.hum*0.15;
          r.hum=h.hum;
        }
      }
      if(h.press!=null)r.press=h.press;
    }
  }
  // Web Bluetooth hides the hardware MAC, but the HolyIoT embeds it in its
  // Device Information (0x180A) service data: [counter][MAC 6 bytes][...].
  if(ev.serviceData) for(const [uuid,dv] of ev.serviceData){
    if((""+uuid).toLowerCase().includes("180a")){
      const b=bytesOf(dv);
      if(b.length>=7) r.mac=[1,2,3,4,5,6].map(i=>b[i].toString(16).padStart(2,"0")).join(":").toUpperCase();
    }
  }
  sampleAll();
  if(cur==="home") renderHome();
  if(cur==="sensori") renderSensori();
  updateLive();
}

/* ---------- readings + sampling ---------- */
function readingsFor(h){
  const u=h.roles?.under?live.get(h.roles.under):null;
  const e=h.roles?.ext?live.get(h.roles.ext):null;
  return {uT:u?.temp??null,uH:u?.hum??null,eT:e?.temp??null,uRssi:u?.rssi,eRssi:e?.rssi,uSeen:u?.seen,eSeen:e?.seen};
}
const lastSampleMap={}, lastKeyMap={};
function sampleAll(){
  const now=Date.now();
  horses.forEach(h=>{
    const r=readingsFor(h); if(r.uT==null) return;
    if(now-(lastSampleMap[h.id]||0)<30000) return;
    lastSampleMap[h.id]=now;
    const hist=histOf(h.id);
    hist.push({t:now,uT:r.uT,uH:r.uH,eT:r.eT});
    if(hist.length>720) historyMap[h.id]=hist.slice(-720);
    const c=comfort(r.uT,r.uH,r.eT);
    if(c && c.key!==lastKeyMap[h.id]){
      if(["freddo","sudore"].includes(c.key)){
        const al=alertsOf(h.id);
        al.unshift({t:now,key:c.key,title:c.label,
          detail:`${h.name} · sotto coperta ${r.uT.toFixed(1)}°C · esterno ${r.eT!=null?r.eT.toFixed(1)+"°C":"—"}${r.uH!=null?" · umidità "+r.uH.toFixed(0)+"%":""}`});
        alertsMap[h.id]=al.slice(0,60);
      }
      lastKeyMap[h.id]=c.key;
    }
  });
  store.set("history_v2",historyMap); store.set("alerts_v2",alertsMap);
}

/* ---------- helpers ---------- */
const timeAgo=ts=>{ if(!ts) return "—"; const s=Math.round((Date.now()-ts)/1000); return s<60?s+"″ fa":Math.round(s/60)+"′ fa"; };
const hhmm=ts=>{ const d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function horseSelector(){
  return `<div class="hsel">`+horses.map(h=>`<button class="hchip ${h.id===activeId?"on":""}" onclick="setActive('${h.id}')">${h.name||"—"}</button>`).join("")
    +`<button class="hchip add" onclick="newHorse()">＋ Cavallo</button></div>`;
}

/* ---------- views ---------- */
function renderHome(){
  const el=$("#v-home"); const h=activeHorse();
  const r=readingsFor(h); const c=comfort(r.uT,r.uH,r.eT);
  const delta=(r.uT!=null&&r.eT!=null)?(r.uT-r.eT):null;
  let inner;
  if(!h.roles.under){
    inner=`<div class="card q"><div class="idrow"><div class="av">🐎</div><div><div class="nm">${h.name}</div><div class="mt">${h.blanket||"coperta non impostata"}</div></div></div>
      <p class="sub" style="margin-top:12px">Abbina i sensori di ${h.name}: quello <b>sotto la coperta</b> e quello <b>esterno</b>.</p>
      <button class="btn" style="margin-top:12px" onclick="go('sensori')">Abbina i sensori</button></div>`;
  } else if(!scanning){
    inner=`<div class="card"><div class="idrow"><div class="av">🐎</div><div><div class="nm">${h.name}</div><div class="mt">${h.blanket||""}</div></div></div>
      <p class="sub" style="margin-top:12px">Monitoraggio in pausa. Avvialo per leggere in continuo i sensori abbinati e vedere la temperatura di ${h.name}.</p>
      <button class="btn" style="margin-top:12px" onclick="startScan(false)">▶ Avvia monitoraggio</button></div>`;
  } else if(!c){
    inner=`<div class="card"><div class="idrow"><div class="av">🐎</div><div><div class="nm">${h.name}</div><div class="mt">${h.blanket||""}</div></div></div>
      <p class="sub" style="margin-top:12px">In attesa di dati dal sensore sotto coperta… assicurati che sia acceso e vicino, e che la scansione sia attiva.</p>
      <button class="btn ghost sm" style="margin-top:10px" onclick="toggleScan()">${scanning?"Scansione attiva":"Avvia scansione"}</button></div>`;
  } else {
    inner=`<div class="card">
      <div class="idrow"><div class="av">🐎</div>
        <div><div class="nm">${h.name}</div><div class="mt">${h.blanket||""}${h.box?" · "+h.box:""}</div></div>
        <div class="sp"></div>
        <span class="pill" style="color:${c.color};background:color-mix(in srgb,${c.color} 13%,transparent);border-color:color-mix(in srgb,${c.color} 32%,transparent)">${c.label}</span>
      </div>
      <div class="word"><span class="lamp" style="background:${c.color}"></span>${c.label}</div>
      <p class="msg">${c.msg}${delta!=null?` La coperta tiene <b>${delta>=0?"+":""}${delta.toFixed(1)}°</b> sull'esterno.`:""}</p>
      <div class="band"><div class="mk" style="left:${c.pos}%"></div></div>
      <div class="bl"><span>Freddo</span><span>Ideale</span><span>Sudore</span></div>
      ${c.sev==="hot"?`<div class="alarm">🔴 Sudorazione — controlla la coperta</div>`:""}
      ${c.sev==="cold"?`<div class="alarm cold">🔵 Troppo freddo — coperta insufficiente</div>`:""}
    </div>
    <div class="tiles">
      <div class="tile"><div class="k">Sotto coperta</div><div class="v">${r.uT.toFixed(1)}<small>°C</small></div><div class="s">${(r.uH!=null?"umidità "+r.uH.toFixed(0)+"% · ":"")+timeAgo(r.uSeen)}</div></div>
      <div class="tile"><div class="k">Esterno</div><div class="v">${r.eT!=null?r.eT.toFixed(1):"—"}<small>°C</small></div><div class="s">${r.eT!=null?timeAgo(r.eSeen):"nessun sensore esterno"}</div></div>
      <div class="tile"><div class="k">Δ isolamento</div><div class="v">${delta!=null?(delta>=0?"+":"")+delta.toFixed(1):"—"}<small>°C</small></div><div class="s">efficacia coperta</div></div>
      <div class="tile"><div class="k">Umidità pelo</div><div class="v">${r.uH!=null?r.uH.toFixed(0):"—"}<small>%</small></div><div class="s">${r.uH!=null&&r.uH>=TH.humSweat?"alta · sudore":"nella norma"}</div></div>
    </div>`;
  }
  el.innerHTML=horseSelector()+inner;
}

function chartSVG(pts){
  if(pts.length<2) return `<p class="sub" style="text-align:center;padding:14px 0">Ancora pochi dati. Lo storico si riempie mentre l'app scansiona (un punto ogni 30″).</p>`;
  const W=300,H=150,pad=8;
  const all=pts.flatMap(p=>[p.uT,p.eT]).filter(v=>v!=null);
  let lo=Math.min(...all),hi=Math.max(...all); if(hi-lo<6){const m=(hi+lo)/2;lo=m-3;hi=m+3;}
  lo=Math.floor(lo-1); hi=Math.ceil(hi+1);
  const x=i=>pad+i*(W-2*pad)/(pts.length-1);
  const y=v=>H-pad-(v-lo)/(hi-lo)*(H-2*pad);
  const line=(key,col,w)=>{let d="",started=false;pts.forEach((p,i)=>{if(p[key]==null){started=false;return;}d+=(started?"L":"M")+x(i).toFixed(1)+" "+y(p[key]).toFixed(1)+" ";started=true;});return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"/>`;};
  const bT=y(TH.ideale),bB=y(TH.fresco);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <rect x="${pad}" y="${bT.toFixed(1)}" width="${W-2*pad}" height="${Math.max(0,bB-bT).toFixed(1)}" fill="color-mix(in srgb,var(--ideal) 15%,transparent)"/>
    ${line("eT","var(--cold)",2.2)}${line("uT","var(--accent)",2.6)}</svg>`;
}
function renderStorico(){
  const el=$("#v-storico"); const h=activeHorse();
  const pts=histOf(h.id).slice(-120);
  let inband=0; pts.forEach(p=>{ if(p.uT>=TH.fresco&&p.uT<=TH.ideale) inband++; });
  const pct=pts.length?Math.round(inband/pts.length*100):0;
  const deltas=pts.filter(p=>p.uT!=null&&p.eT!=null).map(p=>p.uT-p.eT);
  const avgD=deltas.length?(deltas.reduce((a,b)=>a+b,0)/deltas.length):null;
  el.innerHTML=horseSelector()+`<h2 class="t">Storico · ${h.name}</h2>
    <div class="card">${chartSVG(pts)}
      <div class="bl" style="margin-top:10px"><span style="color:var(--accent)">● Sotto coperta</span><span style="color:var(--cold)">● Esterno</span><span style="color:var(--ideal)">▬ Banda ideale</span></div></div>
    <div class="tiles">
      <div class="tile plain"><div class="k">Δ medio</div><div class="v">${avgD!=null?(avgD>=0?"+":"")+avgD.toFixed(1):"—"}<small>°C</small></div><div class="s">isolamento medio</div></div>
      <div class="tile plain"><div class="k">In comfort</div><div class="v">${pct}<small>%</small></div><div class="s">${pts.length} campioni</div></div>
    </div>
    <p class="sub" style="margin:6px 2px">La web app registra solo mentre è aperta. Storico continuo H24 e conservazione (24h / 7 giorni) arriveranno col gateway in stalla.</p>`;
}

function renderAvvisi(){
  const el=$("#v-avvisi"); const h=activeHorse(); const al=alertsOf(h.id);
  const icon={freddo:"❄️",sudore:"💧"}, col={freddo:"var(--cold)",sudore:"var(--hot)"};
  el.innerHTML=horseSelector()+`<h2 class="t">Avvisi · ${h.name}</h2>`+
    (al.length?al.map(a=>`<div class="alert"><div class="stripe" style="background:${col[a.key]||"var(--muted)"}"></div>
      <div class="ic" style="background:color-mix(in srgb,${col[a.key]||"var(--muted)"} 15%,transparent)">${icon[a.key]||"⚠️"}</div>
      <div class="sp" style="flex:1"><div class="t">${a.title}</div><div class="d">${a.detail}</div></div>
      <div class="tm">${hhmm(a.t)}</div></div>`).join("")
    :`<div class="card"><p class="sub">Nessun avviso. Quando il comfort esce dalla banda ideale (troppo freddo o sudorazione) lo troverai qui.</p></div>`)+
    (al.length?`<button class="btn ghost sm" onclick="clearAlerts()">Cancella avvisi</button>`:"");
}

let editing=null, draft=null;
function renderScheda(){
  const el=$("#v-scheda");
  if(editing){
    const h = editing==="new" ? draft : horses.find(x=>x.id===editing);
    el.innerHTML=`<h2 class="t">${editing==="new"?"Nuovo cavallo":"Modifica scheda"}</h2>
      <div class="card">
        <label class="f">Nome</label><input class="f" id="h-name" value="${h.name||""}">
        <div class="two"><div><label class="f">Razza</label><input class="f" id="h-breed" value="${h.breed||""}"></div>
          <div><label class="f">Sesso</label><input class="f" id="h-sex" value="${h.sex||""}"></div></div>
        <div class="two"><div><label class="f">Età</label><input class="f" id="h-age" value="${h.age||""}"></div>
          <div><label class="f">Peso (kg)</label><input class="f" id="h-weight" value="${h.weight||""}"></div></div>
        <label class="f">Coperta</label><input class="f" id="h-blanket" value="${h.blanket||""}">
        <label class="f">Box / scuderia</label><input class="f" id="h-box" value="${h.box||""}">
        <label class="f">Note</label><input class="f" id="h-notes" value="${h.notes||""}">
        <button class="btn" style="margin-top:14px" onclick="saveHorse()">Salva</button>
        <button class="btn ghost sm" style="margin-top:8px" onclick="cancelEdit()">Annulla</button>
        ${editing!=="new"&&horses.length>1?`<button class="btn danger sm" style="margin-top:8px" onclick="deleteHorse('${editing}')">Elimina cavallo</button>`:""}
      </div>`;
    return;
  }
  el.innerHTML=`<h2 class="t">I miei cavalli</h2>`+
    horses.map(h=>{
      const r=readingsFor(h); const c=comfort(r.uT,r.uH,r.eT);
      const pill=c?`<span class="pill" style="color:${c.color};background:color-mix(in srgb,${c.color} 13%,transparent)">${c.label}</span>`
                 :`<span class="pill" style="color:var(--muted);background:var(--surface2)">${h.roles.under?"in attesa":"no sensori"}</span>`;
      return `<div class="hcard ${h.id===activeId?"on":""}">
        <div class="av" onclick="setActive('${h.id}')">🐎</div>
        <div class="sp" onclick="setActive('${h.id}')"><div class="nm" style="font-family:var(--serif);font-size:16px;font-weight:700">${h.name}</div>
          <div class="mt" style="font-size:11.5px;color:var(--muted)">${[h.breed,h.blanket].filter(Boolean).join(" · ")||"scheda da completare"}</div></div>
        ${pill}
        <button class="edit" onclick="editHorse('${h.id}')">✎</button>
      </div>`;
    }).join("")+
    `<button class="btn" style="margin-top:6px" onclick="newHorse()">＋ Aggiungi cavallo</button>`;
}

function renderSensori(){
  const el=$("#v-sensori"); const h=activeHorse();
  const now=Date.now();
  const list=[...live.values()].filter(d=>d.temp!=null).sort((a,b)=>(b.rssi??-999)-(a.rssi??-999));
  const maxRssi=list.length?Math.max(...list.map(d=>d.rssi??-999)):-999;
  const roleName=id=>h.roles.under===id?"under":h.roles.ext===id?"ext":null;
  el.innerHTML=horseSelector()+`<h2 class="t">Sensori di ${h.name}</h2>
    <div class="notice">Non sai quale sensore è quale? <b>Avvicina</b> un sensore al telefono (compare 📍 <b>più vicino</b>) oppure <b>soffiaci sopra</b> 2″ (compare 🌬️ <b>questo!</b>). Poi assegna <b>Sotto coperta</b> o <b>Esterno</b>. ${!navigator.bluetooth?"⚠️ Web Bluetooth non disponibile in questo browser.":""}</div>
    <button class="btn ${scanning?"ghost":""}" onclick="toggleScan()">${scanning?"⏸ Ferma monitoraggio":"🔍 Avvia monitoraggio / cerca"}</button>
    <div class="sec">Sensori rilevati (${list.length})</div>
    ${list.length?list.map(d=>{const rn=roleName(d.id);
      const blown=d.idUntil&&d.idUntil>now;
      const near=!blown && d.rssi===maxRssi && d.rssi>-52;
      const badge=blown?`<span class="badge blow">🌬️ questo!</span>`:near?`<span class="badge near">📍 più vicino</span>`:"";
      return `<div class="dev ${blown?"hl":""}">
      <div class="rd">📡</div>
      <div class="sp"><div class="nm">${d.mac||d.name}${badge}</div><div class="mt">${d.mac?d.name+" · ":""}${d.temp.toFixed(1)}°C · umidità ${d.hum!=null?d.hum.toFixed(0)+"%":"—"} · ${d.rssi??"?"} dBm</div></div>
      <div class="rolebtns">
        <button class="rb ${rn==="under"?"on":""}" onclick="assign('under','${d.id}')">Sotto</button>
        <button class="rb ${rn==="ext"?"on":""}" onclick="assign('ext','${d.id}')">Esterno</button>
      </div></div>`;}).join("")
    :`<div class="card"><p class="sub">${scanning?"Scansione in corso… avvicina i sensori.":"Premi «Cerca sensori» per iniziare."}</p></div>`}
    <div class="sec">Abbinati a ${h.name}</div>
    <div class="card q"><p class="sub">Sotto coperta: <b>${h.roles.under?(live.get(h.roles.under)?.mac||live.get(h.roles.under)?.name||h.roles.under):"—"}</b><br>Esterno: <b>${h.roles.ext?(live.get(h.roles.ext)?.mac||live.get(h.roles.ext)?.name||h.roles.ext):"—"}</b></p></div>`;
}

/* ---------- actions ---------- */
window.setActive=id=>{ activeId=id; store.set("activeId",activeId); go("home"); };
window.newHorse=()=>{ editing="new"; draft=defaultHorse(); go("scheda"); };
window.editHorse=id=>{ editing=id; go("scheda"); };
window.cancelEdit=()=>{ editing=null; draft=null; renderScheda(); };
window.saveHorse=()=>{
  const g=k=>$("#h-"+k)?.value.trim()??"";
  const fields=["name","breed","sex","age","weight","blanket","box","notes"];
  if(editing==="new"){ fields.forEach(k=>draft[k]=g(k)); if(!draft.name)draft.name="Nuovo cavallo"; horses.push(draft); activeId=draft.id; }
  else{ const h=horses.find(x=>x.id===editing); if(h) fields.forEach(k=>h[k]=g(k)); }
  store.set("horses",horses); store.set("activeId",activeId);
  editing=null; draft=null; go("home");
};
window.deleteHorse=id=>{ if(horses.length<=1) return; horses=horses.filter(h=>h.id!==id);
  if(activeId===id) activeId=horses[0].id;
  store.set("horses",horses); store.set("activeId",activeId);
  editing=null; renderScheda(); };
window.assign=(role,id)=>{ const h=activeHorse(); if(h.roles[role]===id) delete h.roles[role];
  else{ h.roles[role]=id; const o=role==="under"?"ext":"under"; if(h.roles[o]===id) delete h.roles[o]; }
  store.set("horses",horses); renderSensori(); };
window.clearAlerts=()=>{ alertsMap[activeId]=[]; store.set("alerts_v2",alertsMap); renderAvvisi(); };

/* ---------- router ---------- */
let cur="home";
const render={home:renderHome,storico:renderStorico,avvisi:renderAvvisi,scheda:renderScheda,sensori:renderSensori};
window.go=v=>{ if(v!=="scheda"){ editing=null; draft=null; } cur=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  $("#v-"+v).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===v));
  render[v](); window.scrollTo(0,0);
};
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));

/* ---------- BLE scan ---------- */
function notice(html,cls=""){ $("#notice").innerHTML=html?`<div class="notice ${cls}">${html}</div>`:""; }
function updateLive(){ $("#live").classList.toggle("on",scanning); $("#liveTxt").textContent=scanning?"monitoraggio attivo":"in pausa"; }
const hasSensors=()=>horses.some(h=>h.roles&&h.roles.under);

// Monitoring = the LE scan. Once sensors are paired it must stay active across
// pages (independent of the "cerca sensori" discovery), so paired sensors keep
// updating the horse. Web Bluetooth needs a user gesture to (re)start a scan,
// so we try to auto-start and fall back to a Home button if a tap is required.
async function startScan(silent){
  if(scanning) return true;
  if(!navigator.bluetooth||!navigator.bluetooth.requestLEScan){
    if(!silent) notice("Per leggere i sensori serve <b>Chrome su Android</b> con il flag <code>chrome://flags/#enable-experimental-web-platform-features</code> attivo, e la pagina in HTTPS.","err");
    return false; }
  try{
    leScan=await navigator.bluetooth.requestLEScan({acceptAllAdvertisements:true,keepRepeatedDevices:true});
    if(!scanStarted){ navigator.bluetooth.addEventListener("advertisementreceived",ingest); scanStarted=true; }
    scanning=true; needGesture=false; notice(""); updateLive(); render[cur](); return true;
  }catch(err){
    if(silent){ needGesture=true; }
    else notice("Monitoraggio non avviato: "+(err?.message||err)+"<br>Attiva Bluetooth e Localizzazione e concedi il permesso.","err");
    updateLive(); render[cur](); return false;
  }
}
function stopScan(){ try{leScan&&leScan.stop();}catch(_){} scanning=false; updateLive(); render[cur](); }
window.toggleScan=()=>scanning?stopScan():startScan(false);
$("#live").parentElement.style.cursor="pointer";
$(".live").addEventListener("click",()=>toggleScan());

setInterval(()=>{ if(scanning && cur==="home") renderHome(); if(scanning && cur==="sensori") renderSensori(); },3000);

if(!navigator.bluetooth) notice("Apri Manto in <b>Chrome su Android</b> (in HTTPS) per leggere i sensori. Su iPhone il web non accede al Bluetooth — arriverà con l'app nativa.");
go("home");
// auto-start monitoring if sensors are already paired
if(hasSensors()) startScan(true);
</script>
